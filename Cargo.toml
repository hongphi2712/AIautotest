[workspace]
members = [
    "apps/api-tester-cli",
    "apps/api-tester-server",
    "crates/ai",
    "crates/analysis",
    "crates/application",
    "crates/auth",
    "crates/capture",
    "crates/config",
    "crates/domain",
    "crates/events",
    "crates/ports",
    "crates/proxy",
    "crates/query",
    "crates/reporting",
    "crates/scanner",
    "crates/security",
    "crates/storage",
    "crates/test-support",
    "crates/workflow",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["API-AutoTester Team"]

[workspace.dependencies]
api-tester-ai = { path = "crates/ai" }
api-tester-analysis = { path = "crates/analysis" }
api-tester-application = { path = "crates/application" }
api-tester-auth = { path = "crates/auth" }
api-tester-capture = { path = "crates/capture" }
api-tester-config = { path = "crates/config" }
api-tester-domain = { path = "crates/domain" }
api-tester-events = { path = "crates/events" }
api-tester-ports = { path = "crates/ports" }
api-tester-proxy = { path = "crates/proxy" }
api-tester-query = { path = "crates/query" }
api-tester-reporting = { path = "crates/reporting" }
api-tester-scanner = { path = "crates/scanner" }
api-tester-security = { path = "crates/security" }
api-tester-storage = { path = "crates/storage" }
api-tester-test-support = { path = "crates/test-support" }
api-tester-workflow = { path = "crates/workflow" }

async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
criterion = "0.5"
flate2 = "1"
brotli = "7"
futures-util = "0.3"
governor = "0.8"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
md5 = "0.7"
proptest = "1"
rand = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.22"
rsa = { version = "0.9", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = "0.16"
open = "5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Keep debug builds small: line-tables-only debug info (~90% smaller artifacts)
# and disable incremental cache bloat so target/ stops growing unbounded.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = false

# Release builds: dependencies at opt-level 1 keep LLVM from saturating cores
# (default -O3 on ~350 crates pegs the CPU), while thin-LTO + strip keep the
# single self-contained exe small. Runtime here is I/O-bound (UI + proxy), so
# opt-level 1 is more than enough for our own crates too.
[profile.release]
lto = "thin"
codegen-units = 8
strip = true
debug = false

[profile.release.package."*"]
opt-level = 1
